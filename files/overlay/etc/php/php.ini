; php.ini minimal et durci pour la cible embarquée

; Exécution via le httpd BusyBox (pas de redirection Apache)
cgi.force_redirect = 0

; Ne pas divulguer d'informations au client
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Réduire la surface d'attaque
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
open_basedir = /var/www:/proc:/tmp
file_uploads = Off

; Limites de ressources (la cible a peu de RAM)
memory_limit = 32M
max_execution_time = 10
post_max_size = 1M

date.timezone = Europe/Paris
